<!DOCTYPE html>
<html>
    <head>
        <title>Div ile HTML Web sayfası şablonu</title>
        <style>
            header{
                
                width: 900px;
                border: 1px dotted darkblue;
                height: 60px;
                background-color: orange;
                text-align: center;
                line-height: 60px;
            }
            nav{
                width: 200px;
                border: 1px dotted darkblue;
                height: 200px;
                background-color: purple;
                text-align: center;
                float: left;
            }
            section{
                width: 500px;
                border: 1px dotted darkblue;
                height: 200px;
                background-color: rgb(201, 120, 201);
                text-align: center;
                float: left;
            }
             aside{
                width: 200px;
                border: 1px dotted darkblue;
                height: 200px;
                background-color: rgb(0, 47, 255);
                text-align: center;
                float: left;
            }
            footer{
                width: 900px;
                border:1px dotted darkblue;
                height: 40px;
                background-color: gray;
                text-align: center;
                clear: left;
            }
              section header{
                width: 90%;
                border: 1px dotted rgb(0, 255, 115);
                height: 40px;
                background-color: orange;
                text-align: center;
                line-height: 40px;
                margin: auto auto;
            }
              section article{
                width: 90%;
                border: 1px dotted rgb(0, 255, 115);
                height: 40px;
                background-color: tomato;
                text-align: center;
                line-height: 40px;
                margin: 20px auto;
            }
              section Footer{
                width: 90%;
                border: 1px dotted rgb(0, 255, 115);
                height: 40px;
                background-color: gray;
                text-align: center;
                line-height: 40px;
                margin: auto auto;
            }
            
        
        
            
        </style>
    </head>
    <body>
    <header >HEADER</header>
    <nav>NAV</nav>
     <section >Section
    <header> Header </header>
    <article> article </article>
    <footer> Footer </footer>
    </section>
    <aside  >Aside</aside>
    
    <footer >Footer</footer>
    </body>
</html>
