<!DOCTYPE html>
<html>
<head>
<title>Div ile HTML Web Sayfası Şablonu</title>
<style>
    #header{
width:900 ;
border: 1px dotted darkblue;
height:60px;
background-color: orange;
text-align:center;
line-height:60px;
}
#nav{
width:200px;
border: 1px dotted darkblue;
height:200px;
background-color:purple;
text-align:center;
float: left;
}

#section{
width:200px;
border: 1px dotted darkblue;
height:200px;
background-color:rgb(238, 238, 24);
text-align:center;
float:left;
}

#aside{
width:200px;
border: 1px dotted darkblue;
height:200px;
background-color:rgb(42, 228, 67);
text-align:center;
float:left;
}
#Footer{
width:900px;
border:1px dotted darkblue;
height:40px;
background-color:gray;
text-align:center;
clear:left;
}

#sheader{
width:90%;
border: 1px dotted rgb(199, 36, 158);
height:40px;
background-color:orange;
text-align:center;
line-height:40px;
margin:auto;
}

#article{
width:90%;
border: 1px dotted rgb(179, 116, 163);
height:40px;
background-color:tomato;
text-align:center;
line-height:40px;
margin: 20px auto;
}
#sfooter{
width:90%;
border: 1px dotted rgb(73, 151, 182);
height:40px;
background-color:gray;
text-align:center;
line-height:40px;
margin: 20px auto auto;
}

</style>
</head>
<body>
    <div id="header">HEADER</div>
    <div id="nav">NAV</div>
    <div id="section">SECTİON</div>
    <div id="aside">ASİDE</div>
</body>

</html>
